name: Keep Render Awake

on:
  # UTC 22-23,0-13 = JST 7:00-23:00(日中のみ10分間隔でpingし、夜間はスリープを許容する)
  schedule:
    - cron: "*/10 22-23,0-13 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check endpoint
        run: curl --retry 2 --retry-delay 5 --max-time 90 -fsS https://pet-health-b56w.onrender.com/up
